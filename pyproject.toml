[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prerequisite-circuits"
version = "0.1.0"
description = "Track intervention effectiveness and learning in matched training experiments."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{name = "Kunwar Kalra"}, {name = "Thanush Patlolla"}]
dependencies = []
keywords = ["mechanistic-interpretability", "learning-dynamics", "pytorch", "interventions"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
train = ["torch>=2.5,<3", "numpy>=1.26,<3"]
plot = ["matplotlib>=3.8,<4"]
browser = ["playwright>=1.50,<2"]
pythia = ["prerequisite-circuits[train]", "transformers>=4.45,<6"]
dev = ["prerequisite-circuits[train,plot]", "pytest>=8,<10", "build>=1.2", "ruff>=0.11"]

[project.scripts]
prereq = "prerequisite_circuits.cli:main"

[project.urls]
Repository = "https://github.com/KunwarK13/Prerequisite_Circuits"
Documentation = "https://github.com/KunwarK13/Prerequisite_Circuits/tree/main/docs"
Issues = "https://github.com/KunwarK13/Prerequisite_Circuits/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prerequisite_circuits = ["py.typed", "report.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the optional model dependencies", "artifact: requires downloaded paper assets"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
